[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iontrap-rng-analytic"
version = "0.1.0"
description = "Small analytical M1 model for a four-hyperbola RF ion trap RNG"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
fem = ["gmsh>=4.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
